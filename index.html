<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Getting Surface Data. Start Getting Sales Intelligence.</title>
    <meta name="description" content="Deploy a Custom-GPT that extracts detailed customer profiles, generates personalized value, and pre-qualifies your hottest prospects.">

    <!-- CDN Libraries -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS with Advanced Animations -->
    <style>
        :root {
            --color-bg: #ffffff;
            --color-fg: #1e293b;
            --color-accent: #2563eb;
            --color-muted: #64748b;
            --color-border: #e2e8f0;
            --color-light: #f8fafc;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
        }

        /* Typing Effect */
        .typing-text {
            overflow: hidden;
            border-right: 3px solid var(--color-accent);
            white-space: nowrap;
            margin: 0 auto;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--color-accent) }
        }

        /* Scroll Triggered Animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s ease;
        }

        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-in-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.8s ease;
        }

        .fade-in-left.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .fade-in-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.8s ease;
        }

        .fade-in-right.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Counter Animation */
        .counter {
            font-size: 3rem;
            font-weight: bold;
            color: var(--color-accent);
        }

        /* Progress Bars */
        .progress-bar {
            width: 0%;
            height: 10px;
            background: linear-gradient(90deg, var(--color-accent), var(--color-success));
            border-radius: 5px;
            transition: width 2s ease;
        }

        .progress-bar.animate {
            width: var(--progress-width);
        }

        /* Before/After Slider */
        .before-after-slider {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
        }

        .slider-handle {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 100%;
            background: white;
            cursor: ew-resize;
            z-index: 10;
        }

        .slider-handle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Floating Elements */
        .float-animation {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Message Bubble Animation */
        .message-bubble {
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            animation: bubbleAppear 0.6s ease forwards;
        }

        @keyframes bubbleAppear {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Hover Transforms */
        .hover-scale:hover {
            transform: scale(1.05);
            transition: all 0.3s ease;
        }

        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }

        /* Interactive Tabs */
        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Gradient Backgrounds */
        .gradient-bg-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .gradient-bg-2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .gradient-bg-3 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        /* Language Toggle */
        .lang-toggle {
            background: white;
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            padding: 0.25rem;
            display: flex;
            gap: 0.25rem;
        }

        .lang-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--color-accent);
            color: white;
        }

        /* CTA Buttons */
        .btn-primary {
            background: var(--color-accent);
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-accent);
            border: 2px solid var(--color-accent);
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--color-accent);
            color: white;
            transform: translateY(-2px);
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        /* Step Animation */
        .step-item {
            opacity: 0.3;
            transform: scale(0.9);
            transition: all 0.6s ease;
        }

        .step-item.active {
            opacity: 1;
            transform: scale(1);
        }

        .step-item.completed {
            opacity: 1;
            transform: scale(1);
        }

        /* Pulse Effect */
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 5px rgba(37, 99, 235, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(37, 99, 235, 0.8);
            }
        }

        /* Enhanced Mobile Optimization */
        @media (max-width: 768px) {
            /* Better spacing on mobile */
            body {
                font-size: 16px;
                line-height: 1.5;
            }

            /* Header mobile fixes */
            .lang-toggle {
                padding: 0.125rem;
                gap: 0.125rem;
            }

            .lang-btn {
                padding: 0.375rem 0.75rem;
                font-size: 0.875rem;
            }

            /* Hero section mobile */
            h1 {
                font-size: 2rem !important;
                line-height: 1.2 !important;
            }

            .typing-text {
                font-size: 1rem !important;
                white-space: normal !important;
                border-right: none !important;
            }

            /* Button mobile fixes */
            .btn-primary, .btn-secondary, .whatsapp-btn {
                padding: 0.875rem 1.25rem;
                font-size: 1rem;
                width: 100%;
                justify-content: center;
            }

            /* Counter mobile */
            .counter {
                font-size: 2rem !important;
            }

            /* Pricing cards mobile - WIDER */
            .pricing-card {
                padding: 1rem !important;
                margin: 0 !important;
            }

            .price {
                font-size: 2.5rem !important;
            }

            /* Features list mobile */
            .features-list li {
                font-size: 0.875rem;
            }

            /* Bonus section mobile */
            .bg-green-50 {
                padding: 1rem !important;
            }

            .bg-green-50 li {
                font-size: 0.75rem !important;
            }

            /* Step timeline mobile */
            .step-item {
                font-size: 0.875rem;
            }

            /* Story cards mobile */
            .story-card, .insight-card {
                padding: 1.25rem !important;
            }

            /* Darya character card - avatar centered, text full width */
            .character-intro {
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                padding: 1.5rem !important;
            }

            .character-info {
                width: 100% !important;
            }

            .character-intro .grid {
                grid-template-columns: 1fr !important;
                gap: 0.75rem !important;
            }

            .character-avatar {
                margin-bottom: 1rem;
            }

            /* Demo section - fix emoji being cut off */
            .text-8xl {
                font-size: 3.5rem !important;
            }

            /* ValueStack - fix prices being cut off */
            .text-3xl {
                font-size: 1.5rem !important;
                white-space: nowrap;
            }

            /* Footer mobile */
            .footer a {
                font-size: 0.875rem;
                display: block;
                margin: 0.5rem 0;
            }

            /* Max width for readability - WIDER on mobile */
            .max-w-6xl, .max-w-4xl {
                padding-left: 0.75rem !important;
                padding-right: 0.75rem !important;
            }

            /* Better touch targets */
            a, button {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
            }

            /* Reduce excessive padding on mobile */
            .py-20 {
                padding-top: 3rem !important;
                padding-bottom: 3rem !important;
            }

            /* Make cards stack better */
            .grid {
                gap: 1.5rem !important;
            }

            /* Fix overflow issues */
            * {
                max-width: 100%;
                overflow-x: hidden;
            }
        }

        @media (max-width: 480px) {
            /* Extra small screens */
            h1 {
                font-size: 1.75rem !important;
            }

            .text-4xl {
                font-size: 2rem !important;
            }

            .text-2xl {
                font-size: 1.5rem !important;
            }

            .text-xl {
                font-size: 1.125rem !important;
            }

            /* Tighter spacing */
            .gap-6 {
                gap: 1rem !important;
            }

            .gap-8 {
                gap: 1.5rem !important;
            }

            .gap-12 {
                gap: 2rem !important;
            }

            /* Pricing mobile */
            .pricing-card {
                padding: 1.25rem !important;
            }
        }
    </style>
</head>

<body x-data="landingApp()" class="bg-white text-gray-900">
    <!-- Top Navigation -->
    <header class="sticky top-0 bg-white/90 backdrop-blur-sm border-b border-gray-200 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="text-2xl font-bold text-gray-900">SystemHustle</div>

                <div class="flex items-center gap-6">
                    <!-- Language Toggle -->
                    <div class="lang-toggle">
                        <button @click="switchLang('en')"
                                :class="{'active': currentLang === 'en'}"
                                class="lang-btn">EN</button>
                        <button @click="switchLang('ru')"
                                :class="{'active': currentLang === 'ru'}"
                                class="lang-btn">RU</button>
                    </div>

                    <!-- Navigation Links -->
                    <nav class="hidden md:flex items-center gap-6">
                        <a href="#story" class="text-gray-600 hover:text-blue-600 transition-colors" x-text="content[currentLang].nav.story"></a>
                        <a href="#demo" class="text-gray-600 hover:text-blue-600 transition-colors" x-text="content[currentLang].nav.demo"></a>
                        <a href="#pricing" class="btn-primary cursor-pointer" x-text="content[currentLang].nav.cta"></a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Story Section -->
    <section class="py-20 px-4 gradient-bg-1 text-white">
        <div class="max-w-6xl mx-auto">
            <div class="grid lg:grid-cols-2 gap-12 items-center">
                <div class="fade-in-left">
                    <div class="text-sm uppercase tracking-wide opacity-80 mb-4" x-text="content[currentLang].hero.overline"></div>

                    <h1 class="text-4xl md:text-6xl font-bold mb-6 leading-tight">
                        <span x-text="content[currentLang].hero.h1"></span>
                    </h1>

                    <div class="text-xl mb-8 opacity-90 leading-relaxed">
                        <div class="typing-text" x-text="content[currentLang].hero.typing"></div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mb-8">
                        <a @click="scrollToContact" class="btn-primary bg-white text-blue-600 hover:bg-gray-100 cursor-pointer">
                            <span x-text="content[currentLang].hero.primaryCta"></span>
                            <i class="fas fa-arrow-right"></i>
                        </a>
                        <a href="#story" class="btn-secondary border-white text-white hover:bg-white hover:text-blue-600">
                            <span x-text="content[currentLang].hero.secondaryCta"></span>
                        </a>
                    </div>

                    <!-- Scarcity Banner -->
                    <div class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-lg inline-block pulse-glow">
                        <span class="text-sm font-semibold" x-text="content[currentLang].hero.scarcity"></span>
                    </div>
                </div>

                <div class="fade-in-right">
                    <!-- Hero Illustration -->
                    <div class="relative">
                        <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-8 float-animation">
                            <div class="text-center">
                                <div class="text-6xl mb-4">🤖</div>
                                <h3 class="text-xl font-semibold mb-2">AI Sales Intelligence</h3>
                                <p class="opacity-80">Extract. Analyze. Convert.</p>

                                <!-- Animated Metrics -->
                                <div class="grid grid-cols-2 gap-4 mt-6">
                                    <div class="text-center">
                                        <div class="counter" x-text="metrics.conversion + '%'"></div>
                                        <div class="text-sm opacity-75">Conversion Rate</div>
                                    </div>
                                    <div class="text-center">
                                        <div class="counter" x-text="metrics.intelligence + '%'"></div>
                                        <div class="text-sm opacity-75">Customer Intel</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Story Problem Section -->
    <section id="story" class="py-20 px-4">
        <div class="max-w-4xl mx-auto">
            <div class="text-center mb-16 fade-in-up">
                <h2 class="text-4xl font-bold mb-6" x-text="content[currentLang].story.title"></h2>
                <p class="text-xl text-gray-600" x-text="content[currentLang].story.subtitle"></p>
            </div>

            <!-- Story Character -->
            <div class="bg-gradient-to-r from-red-50 to-pink-50 rounded-2xl p-8 mb-12 fade-in-up">
                <div class="flex items-start gap-6">
                    <div class="w-20 h-20 bg-gradient-to-br from-pink-400 to-red-500 rounded-full flex items-center justify-center text-white text-4xl font-bold">
                        👩‍💼
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold mb-3" x-text="content[currentLang].story.character.name"></h3>
                        <p class="text-lg text-gray-700 mb-4" x-text="content[currentLang].story.character.description"></p>
                        <div class="grid md:grid-cols-3 gap-4">
                            <template x-for="problem in content[currentLang].story.character.problems" :key="problem">
                                <div class="bg-white p-4 rounded-lg border-l-4 border-red-500">
                                    <p class="text-gray-700 font-medium" x-text="problem"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- The Pain -->
            <div class="text-center fade-in-up">
                <div class="inline-block bg-red-100 text-red-700 px-6 py-3 rounded-full font-semibold text-lg mb-8">
                    <span x-text="content[currentLang].story.pain"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- The Awakening Section -->
    <section class="py-20 px-4 bg-gradient-to-r from-blue-50 to-cyan-50">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-16 fade-in-up">
                <h2 class="text-4xl font-bold mb-6" x-text="content[currentLang].awakening.title"></h2>
                <p class="text-xl text-gray-600" x-text="content[currentLang].awakening.subtitle"></p>
            </div>

            <!-- Progressive Reveal -->
            <div class="grid md:grid-cols-2 gap-12 items-center">
                <div class="fade-in-left">
                    <div class="space-y-6">
                        <template x-for="(insight, index) in content[currentLang].awakening.insights" :key="index">
                            <div class="bg-white p-6 rounded-lg shadow-lg hover-lift"
                                 :class="{'opacity-30': index > revealedInsights}"
                                 x-show="index <= revealedInsights">
                                <div class="flex items-start gap-4">
                                    <div class="w-8 h-8 bg-blue-500 text-white rounded-full flex items-center justify-center font-bold text-sm" x-text="index + 1"></div>
                                    <div>
                                        <h3 class="font-semibold mb-2" x-text="insight.title"></h3>
                                        <p class="text-gray-600" x-text="insight.description"></p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <button @click="revealNext()"
                            x-show="revealedInsights < content[currentLang].awakening.insights.length - 1"
                            class="mt-6 btn-primary">
                        <span x-text="content[currentLang].awakening.revealButton"></span>
                        <i class="fas fa-arrow-down"></i>
                    </button>
                </div>

                <div class="fade-in-right">
                    <div class="relative">
                        <div class="bg-white rounded-2xl p-8 shadow-xl">
                            <h3 class="text-2xl font-bold mb-6 text-center" x-text="content[currentLang].awakening.resultTitle"></h3>

                            <!-- Before/After Comparison -->
                            <div class="space-y-4">
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-600">Lead Quality:</span>
                                    <div class="flex gap-2">
                                        <span class="text-red-500 line-through">20%</span>
                                        <span class="text-green-500 font-bold">85%</span>
                                    </div>
                                </div>
                                <div class="progress-bar" style="--progress-width: 85%" :class="{'animate': revealedInsights >= 2}"></div>

                                <div class="flex justify-between items-center">
                                    <span class="text-gray-600">Customer Intel:</span>
                                    <div class="flex gap-2">
                                        <span class="text-red-500 line-through">5%</span>
                                        <span class="text-green-500 font-bold">95%</span>
                                    </div>
                                </div>
                                <div class="progress-bar" style="--progress-width: 95%" :class="{'animate': revealedInsights >= 3}"></div>

                                <div class="flex justify-between items-center">
                                    <span class="text-gray-600">Close Rate:</span>
                                    <div class="flex gap-2">
                                        <span class="text-red-500 line-through">3%</span>
                                        <span class="text-green-500 font-bold">25%</span>
                                    </div>
                                </div>
                                <div class="progress-bar" style="--progress-width: 25%" :class="{'animate': revealedInsights >= 4}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Magic Demo Section -->
    <section id="demo" class="py-20 px-4">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-16 fade-in-up">
                <h2 class="text-4xl font-bold mb-6" x-text="content[currentLang].demo.title"></h2>
                <p class="text-xl text-gray-600" x-text="content[currentLang].demo.subtitle"></p>
            </div>

            <!-- Step by Step Demo -->
            <div class="relative">
                <!-- Steps Timeline -->
                <div class="flex justify-between items-center mb-12">
                    <template x-for="(step, index) in content[currentLang].demo.steps" :key="index">
                        <div class="flex flex-col items-center step-item"
                             :class="{
                                'active': currentStep === index,
                                'completed': currentStep > index
                             }">
                            <div class="w-12 h-12 rounded-full border-4 flex items-center justify-center font-bold text-lg"
                                 :class="{
                                    'bg-blue-500 border-blue-500 text-white': currentStep >= index,
                                    'border-gray-300 text-gray-400': currentStep < index
                                 }">
                                <span x-text="index + 1"></span>
                            </div>
                            <span class="mt-2 text-sm font-medium" x-text="step.title"></span>
                        </div>
                    </template>
                </div>

                <!-- Step Content -->
                <div class="bg-gray-50 rounded-2xl p-8 min-h-96">
                    <template x-for="(step, index) in content[currentLang].demo.steps" :key="index">
                        <div x-show="currentStep === index" class="tab-content" :class="{'active': currentStep === index}">
                            <div class="grid md:grid-cols-2 gap-8 items-center">
                                <div>
                                    <h3 class="text-2xl font-bold mb-4" x-text="step.title"></h3>
                                    <p class="text-lg text-gray-600 mb-6" x-text="step.description"></p>
                                    <ul class="space-y-2">
                                        <template x-for="feature in step.features" :key="feature">
                                            <li class="flex items-center gap-2">
                                                <i class="fas fa-check text-green-500"></i>
                                                <span x-text="feature"></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                                <div class="text-center">
                                    <div class="text-8xl mb-4" x-text="step.icon"></div>
                                    <div class="bg-white rounded-lg p-4 shadow-lg">
                                        <p class="text-sm text-gray-600" x-text="step.example"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Navigation -->
                <div class="flex justify-center gap-4 mt-8">
                    <button @click="prevStep()"
                            x-show="currentStep > 0"
                            class="btn-secondary">
                        <i class="fas fa-arrow-left"></i>
                        <span x-text="content[currentLang].demo.prevButton"></span>
                    </button>

                    <button @click="nextStep()"
                            x-show="currentStep < content[currentLang].demo.steps.length - 1"
                            class="btn-primary">
                        <span x-text="content[currentLang].demo.nextButton"></span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <a @click="scrollToContact"
                       x-show="currentStep === content[currentLang].demo.steps.length - 1"

                    const message = this.currentLang === 'en'
                        ? "Hi! I'm interested in the Early Access pricing for Custom-GPT implementation. Can we discuss the details?"
                        : "Привет! Меня интересуют цены раннего доступа на внедрение Custom-GPT. Можем обсудить детали?";
                    return `https://wa.me/628175755953?text=${encodeURIComponent(message)}`;
                },

                init() {
                    this.animateCounters();
                    this.setupScrollAnimations();
                    // Manual navigation only - auto-advance disabled
                },

                switchLang(lang) {
                    this.currentLang = lang;
                    document.documentElement.lang = lang;
                },

                scrollToContact() {
                    document.getElementById('contact').scrollIntoView({
                        behavior: 'smooth'
                    });
                },

                nextStep() {
                    if (this.currentStep < this.content[this.currentLang].demo.steps.length - 1) {
                        this.currentStep++;
                    }
                },

                prevStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                    }
                },

                revealNext() {
                    if (this.revealedInsights < this.content[this.currentLang].awakening.insights.length - 1) {
                        this.revealedInsights++;
                    }
                },

                animateCounters() {
                    const duration = 2000;
                    const targetConversion = 85;
                    const targetIntelligence = 95;

                    const startTime = Date.now();

                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        this.metrics.conversion = Math.floor(progress * targetConversion);
                        this.metrics.intelligence = Math.floor(progress * targetIntelligence);

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        }
                    };

                    animate();
                },

                setupScrollAnimations() {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('visible');
                            }
                        });
                    });

                    document.querySelectorAll('.fade-in-up, .fade-in-left, .fade-in-right').forEach(el => {
                        observer.observe(el);
                    });
                }
            }
        }
